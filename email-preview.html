<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Preview | Sephora</title>
<style>
*{box-sizing:border-box;}body{margin:0;background:#f5f1ed;color:#241c17;font-family:Arial,sans-serif;line-height:1.5;}
.preview{max-width:780px;margin:40px auto;padding:0 20px;}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;}.toolbar a{color:#5c4031;font-size:14px;}.preview-label{font-size:13px;color:#6d625b;}
.email{background:#fff;border:1px solid #e5d3c5;border-radius:12px;overflow:hidden;box-shadow:0 12px 35px #241c170a;}.email-header{padding:28px;border-bottom:1px solid #e5d3c5;}h1{font-size:23px;line-height:1.3;margin:0 0 22px;}.sender{display:flex;align-items:center;gap:12px;}.avatar{display:grid;place-items:center;background:#171310;color:white;width:42px;height:42px;border-radius:50%;font-family:Georgia,serif;font-size:24px;flex-shrink:0;}.sender p{margin:0;}.address{font-size:13px;color:#76675d;overflow-wrap:anywhere;}.email-body{padding:28px;}.brand{text-align:center;letter-spacing:.2em;font-family:Georgia,serif;font-size:27px;margin:0 0 24px;}.campaign-image{display:block;width:100%;height:auto;border:1px solid #e5d3c5;border-radius:6px;}.preview-note{font-size:12px;color:#76675d;text-align:center;margin:18px 0;}
@media(max-width:520px){.preview{margin:20px auto;padding:0 12px;}.email-header,.email-body{padding:20px;}h1{font-size:20px;}.toolbar{align-items:flex-start;}}
</style>
</head>
<body>
<main class="preview">
  <div class="toolbar"><span class="preview-label">Email marketing preview</span><a href="features.html">Explore Sephora</a></div>
  <article class="email" aria-label="Sample marketing email">
    <header class="email-header">
      <h1>Your Beauty Insider Offer Is Here</h1>
      <div class="sender"><span class="avatar" aria-hidden="true">S</span><div><p><strong>Sephora</strong> <span class="address">&lt;offers@sephora.example&gt;</span></p><p class="address">To: Beauty Insider</p></div></div>
    </header>
    <div class="email-body">
      <p class="brand">SEPHORA</p>
      <!-- Replace the src below with images/email-mockup/your-marketing-image.png after adding your edited PNG to that folder. -->
      <img class="campaign-image" src="images/email-mockup/Email Marketing  Newsletter.png" alt="Your edited email marketing artwork will appear here">
    </div>
  </article>
  <p class="preview-note">Sample email preview only. No email was sent or saved.</p>
</main>
</body>
</html>
